{% extends "base.html" %}{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5 col-xl-4"><div class="card p-4 mt-4"><h1 class="h4 mb-1">Staff sign in</h1><p class="text-muted small">Ambulance drivers, hospital staff and administrators.</p>
{% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login"><label class="form-label" for="em">Email</label><input id="em" class="form-control mb-3" name="email" type="email" autocomplete="username" required>
<label class="form-label" for="pw">Password</label><input id="pw" class="form-control mb-3" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary btn-lg w-100">Sign in</button></form>
<div class="small text-muted mt-3">Demo password <code>demo123</code>: driver1–4@demo.com · hospital1–4@demo.com · admin@demo.com</div><a class="small mt-2" href="/"><i class="bi bi-arrow-left"></i> Back to home</a></div></div></div>
{% endblock %}
